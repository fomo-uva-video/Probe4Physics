defaults:
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: disabled

# Path to the IntPhys2 metadata CSV (or .jsonl/.json/.parquet).
# Expected columns: video_path, scene_id, condition, plausibility (0/1), split.
metadata_file: data/annotations/intphys2_metadata.csv

# Root directory containing the IntPhys2 video files.
videos_root: data/videos/intphys2

# Local cache for any downloaded/materialized videos.
cache_dir: data/cache/intphys2

seed: 42

# Baseline tag used to namespace feature caches for control baselines.
# Leave empty for the standard extraction. Set to "displacement" when running
# the displacement baseline commands (extract.intphys2.displacement, etc.).
# Do not set this manually — the baseline commands inject it automatically.
baseline_tag: ""

split:
  dir: data/splits/intphys2
  # 60/20/20 train/val/test applied to the Main split only (debug is dropped).
  ratios:
    train: 0.6
    val: 0.2
    test: 0.2
  seed: 42
  # Stratify by physics condition so each condition is proportionally represented
  # in every split (mirrors MVP's stratify_keys on question_template).
  stratify_keys:
    - condition
  rare_strata_min_units: 3   # conditions with < 3 scenes are merged into OTHER
  rare_bucket_label: OTHER

# Which split to evaluate on: train | val | test
split_name: test

decode:
  backend: pyav
  num_frames: 16
  sampling: uniform

materialize_missing: false
download_timeout_seconds: 120

predictor:
  mode: oracle  # oracle | random | from_file
  prediction_file: ""

output_dir: artifacts/results/intphys2
output_subdir: ""  # optional stable subdir; empty means timestamped folder

# Used by `python run.py exp.run name=<experiment_id>`
name: ""

backbone:
  name: jepa_v1
  kwargs:
    # Example override from CLI:
    # backbone.kwargs.variant=vitl16_224
    # backbone.kwargs.device=cuda
    device: cpu

feature_cache:
  dir: /scratch-shared/scur0511/probe4physics/artifacts/features/intphys2
  # Feature tensors contain all requested splits together; index.parquet stores
  # the split for each row, and training/eval filter by that column.
  split_names:
    - train
    - val
    - test
  max_samples: 0  # 0 means unlimited; smoke jobs override this to 2
  layer_ids: []  # empty uses adapter defaults (25/50/75/100% depths)
  include_pooled: true
  include_tokens: true
  force_reextract: false
  resume_enabled: true
  resume_strict: true
  chunk_size: 64
  lock_stale_seconds: 86400

probe:
  name: linear  # linear | mlp | temporal_attn
  feature_view: auto  # auto | pooled | tokens_mean | tokens
  layer: last           # last | <int layer id>
  layers: [] # optional list for train_eval.probe.* sweeps
  train_split: train
  epochs: 100
  lr: 0.001
  batch_size: 128
  eval_batch_size: 1024
  weight_decay: 0.0
  device: cpu
  deterministic: false  # enable stricter reproducibility at some performance cost
  output_dir: artifacts/probes/intphys2
  output_subdir: ""        # optional stable subdir for train artifacts
  checkpoint_path: ""      # optional explicit checkpoint for eval.probe.intphys2
  eval_output_dir: artifacts/results/intphys2
  eval_output_subdir: ""   # optional stable subdir for probe eval artifacts
  mlp:
    hidden_dims:
      - 512
    dropout: 0.0
  temporal_attn:
    embed_dim: null
    num_heads: 16
    num_self_attn_blocks: 1
    mlp_ratio: 4.0
    dropout: 0.0
  wandb:
    enabled: false
    project: probe4physics
    entity: ""
    name: ""
    group: ""
    job_type: probe_train
    tags: []
    notes: ""
    mode: online  # online | offline | disabled
    dir: ""       # empty uses the train output_dir
    resume: null
    id: ""
  optuna:
    enabled: false
    n_trials: 20
    n_jobs: 1
    timeout_seconds: 0
    storage: ""
    study_name: ""
    direction: maximize
    metric: ""
    sampler_seed: ${seed}
    pruner:
      enabled: true
      type: median
      n_startup_trials: 3
      n_warmup_steps: 5
      interval_steps: 1
    search_space:
      lr:
        min: 1.0e-5
        max: 1.0e-2
        log: true
      weight_decay:
        min: 1.0e-8
        max: 1.0e-2
        log: true
      batch_size:
        choices: [32, 64, 128, 256]
      epochs:
        enabled: true
        choices: [20, 50, 100, ]
      mlp:
        hidden_dims:
          choices:
            - [256]
            - [512]
            - [1024]
            - [512, 256]
            - [1024, 512, 256]
            - [1024, 512, 1024]
        dropout:
          min: 0.0
          max: 0.5
      temporal_attn:
        num_heads:
          choices: [4, 8, 16]
        num_self_attn_blocks:
          choices: [1, 2, 3]
        mlp_ratio:
          choices: [2.0, 4.0]
        dropout:
          min: 0.0
          max: 0.3

download:
  # HuggingFace repository to download from.
  repo_id: facebook/IntPhys2
  # HF split names to include. HeldOut has no plausibility labels; skip by default.
  splits:
    - Debug
    - Main
  # Where to store the downloaded files. Empty = use videos_root (recommended:
  # avoids a separate copy step — the snapshot becomes the videos directory).
  local_dir: ""

experiment:
  name: intphys2.jepa_v1.probe

hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
