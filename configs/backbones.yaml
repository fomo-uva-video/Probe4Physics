ltx_video:
  default_variant: ltxv_13b_0_9_8_distilled
  # LTX adapter probes deterministic VAE encoder stage activations.
  default_relative_depths: [0.25, 0.5, 0.75, 1.0]
  model_block_depths:
    ltx_vae_5: 5
  variants:
    ltxv_13b_0_9_8_distilled:
