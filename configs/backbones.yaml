jepa_v1:
  default_variant: vith16_384
  checkpoints_dir: data/checkpoints/jepa_v1
  default_relative_depths: [0.25, 0.5, 0.75, 1.0]
  model_block_depths:
    vit_large: 24
    vit_huge: 32
  variants:
    vitl16_224:
      checkpoint_filename: vitl16.pth.tar
      model_name: vit_large
      crop_size: 224
      patch_size: 16
      frames_per_clip: 16
      tubelet_size: 2
    vith16_224:
      checkpoint_filename: vith16.pth.tar
      model_name: vit_huge
      crop_size: 224
      patch_size: 16
      frames_per_clip: 16
      tubelet_size: 2
    vith16_384:
      checkpoint_filename: vith16-384.pth.tar
      model_name: vit_huge
      crop_size: 384
      patch_size: 16
      frames_per_clip: 16
      tubelet_size: 2

jepa_v2:
  default_variant: vitg_384
  checkpoints_dir: data/checkpoints/jepa_v2
  default_relative_depths: [0.25, 0.5, 0.75, 1.0]
  model_block_depths:
    vit_large: 24
    vit_huge: 32
    vit_giant_xformers: 40
  variants:
    vitl_256:
      checkpoint_filename: vitl.pth
      model_name: vit_large
      checkpoint_key: target_encoder
      crop_size: 256
      patch_size: 16
      frames_per_clip: 16
      tubelet_size: 2
    vith_256:
      checkpoint_filename: vith.pth
      model_name: vit_huge
      checkpoint_key: target_encoder
      crop_size: 256
      patch_size: 16
      frames_per_clip: 16
      tubelet_size: 2
    vitg_256:
      checkpoint_filename: vitg.pth
      # Official giant uses vit_giant_xformers (num_heads=22) not vit_giant (num_heads=16)
      model_name: vit_giant_xformers
      checkpoint_key: target_encoder
      crop_size: 256
      patch_size: 16
      frames_per_clip: 16
      tubelet_size: 2
    vitg_384:
      checkpoint_filename: vitg-384.pth
      model_name: vit_giant_xformers
      checkpoint_key: target_encoder
      crop_size: 384
      patch_size: 16
      frames_per_clip: 16
      tubelet_size: 2

