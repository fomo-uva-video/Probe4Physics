defaults:
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: disabled

# Path to the official SSv2 train annotation JSON.
train_annotation_file: data/annotations/ssv2/train.json

# Path to the official SSv2 validation annotation JSON.
val_annotation_file: data/annotations/ssv2/validation.json

# Path to the official SSv2 labels JSON (label_name -> class_index).
labels_file: data/annotations/ssv2/labels.json

# Root directory containing the SSv2 video files (.webm format).
videos_root: data/videos/ssv2

# Local cache for any downloaded/materialized videos.
cache_dir: data/cache/ssv2

seed: 42

split:
  dir: data/splits/ssv2
  max_samples_per_class: 200  # keeps dataset tractable (~29k clips across 174 classes)

# Which predefined split to evaluate on: train | val
split_name: val

decode:
  backend: pyav
  num_frames: 16
  fps: 4
  sampling: uniform

materialize_missing: false
download_timeout_seconds: 120

predictor:
  mode: oracle  # oracle | random | from_file
  prediction_file: ""

output_dir: artifacts/results/ssv2
output_subdir: ""  # optional stable subdir; empty means timestamped folder

# Used by `python run.py exp.run name=<experiment_id>`
name: ""

backbone:
  name: jepa_v1
  kwargs:
    # Example override from CLI:
    # backbone.kwargs.variant=vitl16_224
    # backbone.kwargs.device=cuda
    device: cpu

feature_cache:
  dir: artifacts/features/ssv2
  split_names:
    - train
    - val
  layer_ids: []  # empty uses adapter defaults (25/50/75/100% depths)
  include_pooled: true
  include_tokens: true
  force_reextract: false

linear_probe:
  feature_view: pooled  # pooled | tokens_mean
  layer: last           # last | <int layer id>
  epochs: 30
  lr: 0.001
  batch_size: 128
  eval_batch_size: 1024
  weight_decay: 0.0
  device: cpu
  output_dir: artifacts/probes/ssv2
  output_subdir: ""        # optional stable subdir for train artifacts
  checkpoint_path: ""      # optional explicit checkpoint for eval.linear.ssv2
  eval_output_dir: artifacts/results/ssv2
  eval_output_subdir: ""   # optional stable subdir for linear eval artifacts
  wandb:
    enabled: false
    project: probe4physics
    entity: ""
    name: ""
    group: ""
    job_type: probe_train
    tags: []
    notes: ""
    mode: online  # online | offline | disabled
    dir: ""       # empty uses the train output_dir
    resume: null
    id: ""

experiment:
  name: ssv2.jepa_v1.linear

hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
