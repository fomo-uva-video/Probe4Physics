defaults:
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: disabled

annotation_file: data/annotations/mvp_full.jsonl
official_repo_root: third_party/minimal_video_pairs
videos_root: /scratch-shared/scur0511/probe4physics/data/videos/mvp
cache_dir: data/cache/videos

seed: 42

annotations:
  auto_download: true
  dataset_id: facebook/minimal_video_pairs
  hf_cache_dir: .cache/hf_datasets
  subsets:
    - human_object_interactions
    - intuitive_physics
    - robot_object_interactions
    - temporal_reasoning

split:
  dir: data/splits/mvp/full_60_20_20
  ratios:
    train: 0.6
    val: 0.2
    test: 0.2
  group_key: pair_id
  stratify_keys:
    - source
    - question_template
  rare_strata_min_units: 3
  rare_bucket_label: OTHER
  seed: ${seed}
  template_coverage_check: false

split_name: test
max_pairs: 0

decode:
  backend: pyav
  num_frames: 16
  fps: 4
  sampling: uniform

selection:
  enabled: true
  subset: intuitive_physics # intuitive_physics | all
  plausibility_only: true
  plausibility_keywords:
    - "is this video physically plausible"
    - "is the outcome of the experiment plausible"
    - "is the trajectory of the rotating plank plausible"
    - "is the trajectory of the ball plausible"
    - "is the location of the cube plausible"
    - "is the final position of the ball plausible"
    - "is the final position of the top cube plausible"
    - "is the interaction between the balls plausible"
  require_binary_yes_no: true
  yes_aliases:
    - "yes"
    - "plausible"
    - "possible"
  no_aliases:
    - "no"
    - "implausible"
    - "impossible"
  include_pair_ids: []
  exclude_pair_ids: []
  include_question_contains: []
  drop_incomplete_pairs: true
  artifacts:
    enabled: true

materialize_missing: false
download_timeout_seconds: 120

predictor:
  mode: oracle # oracle | random | from_file
  prediction_file: ""

output_dir: artifacts/results
output_subdir: "" # optional stable subdir; empty means timestamped folder

# Used by `python run.py exp.run name=<experiment_id>`
name: ""

backbone:
  name: jepa_v1
  kwargs:
    # Example override from CLI:
    # backbone.kwargs.variant=vitl16_224
    # backbone.kwargs.checkpoint_path=/absolute/path/to/vitl16.pth.tar
    device: cpu

feature_cache:
  dir: /scratch-shared/scur0511/probe4physics/artifacts/features/mvp
  # Feature tensors contain all requested splits together; index.parquet stores
  # the split for each row, and training/eval filter by that column.
  split_names:
    - train
    - val
    - test
  max_samples: 0 # 0 means unlimited; smoke jobs override this to 2
  layer_ids: [] # empty uses adapter defaults (e.g., 25/50/75/100% depths)
  include_pooled: true
  include_tokens: false
  force_reextract: false
  resume_enabled: true
  resume_strict: true
  chunk_size: 64
  lock_stale_seconds: 86400

probe:
  name: linear # linear | mlp | temporal_attn
  feature_view: auto # auto | pooled | tokens_mean | tokens
  layer: last # last | <int layer id>
  layers: [] # optional list for train_eval.probe.* sweeps
  train_split: train
  epochs: 100
  lr: 0.001
  batch_size: 128
  eval_batch_size: 1024
  weight_decay: 0.0
  device: cpu
  output_dir: artifacts/probes
  output_subdir: "" # optional stable subdir for train artifacts
  checkpoint_path: "" # optional explicit checkpoint for eval.probe.mvp
  eval_output_dir: artifacts/results
  eval_output_subdir: "" # optional stable subdir for probe eval artifacts
  mlp:
    hidden_dims:
      - 512
    dropout: 0.0
  temporal_attn:
    embed_dim: null
    num_heads: 16
    num_self_attn_blocks: 3
    mlp_ratio: 4.0
    dropout: 0.0
  wandb:
    enabled: false
    project: probe4physics
    entity: ""
    name: ""
    group: ""
    job_type: probe_train
    tags: []
    notes: ""
    mode: online # online | offline | disabled
    dir: "" # empty uses the train output_dir
    resume: null
    id: ""
  optuna:
    enabled: false
    n_trials: 20
    n_jobs: 1
    timeout_seconds: 0
    storage: ""
    study_name: ""
    direction: maximize
    metric: ""
    sampler_seed: ${seed}
    pruner:
      enabled: true
      type: median
      n_startup_trials: 3
      n_warmup_steps: 5
      interval_steps: 1
    search_space:
      lr:
        min: 1.0e-5
        max: 1.0e-2
        log: true
      weight_decay:
        min: 1.0e-8
        max: 1.0e-2
        log: true
      batch_size:
        choices: [32, 64, 128, 256]
      epochs:
        enabled: false
        choices: [20, 50, 100]
      mlp:
        hidden_dims:
          choices:
            - [256]
            - [512]
            - [1024]
            - [512, 256]
        dropout:
          min: 0.0
          max: 0.5
      temporal_attn:
        num_heads:
          choices: [4, 8, 16]
        num_self_attn_blocks:
          choices: [1, 2, 3]
        mlp_ratio:
          choices: [2.0, 4.0]
        dropout:
          min: 0.0
          max: 0.3

experiment:
  name: mvp.jepa_v1.probe

hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
